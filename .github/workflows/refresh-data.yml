# Rebuilds the game data from Wikidata and English Wikipedia every week (careers missing from
# Wikidata are filled from the Wikipedia infoboxes), checks it, and opens a pull request with a
# summary of the changes. Nothing goes live until the pull request is merged (merging deploys),
# so that a vandalised Wikidata item is caught by a human first.
# Needs, once, in Settings > Actions > General: "Allow GitHub Actions to create and approve pull requests".
# GitHub only runs scheduled workflows from the default branch (main).
# It can also be started by hand from the Actions tab, on any branch.
name: Refresh data

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  workflow_dispatch:
  # Also runs when the refresh itself changes, so that a new version is tried right away.
  push:
    branches: [main, preview]
    paths: [scripts/build-wiki-careers.mjs, .github/workflows/refresh-data.yml]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150 # the first run reads every Wikipedia article (about 1 h); later runs under half of them
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Keep the current data for comparison
        run: cp src/data/football.json "$RUNNER_TEMP/football-before.json"

      - name: Wikipedia extras (tournaments, Ballon d'Or, top scorers)
        run: |
          # Optional: if Wikipedia fails, keep last week's extras.
          node scripts/build-wiki.mjs --refresh || { echo "::warning::Wikipedia refresh failed, keeping the previous extras"; git checkout scripts/wiki-data.json; }

      - name: Players and careers from Wikidata
        run: node scripts/build-data.mjs --refresh

      - name: Careers from Wikipedia infoboxes, to fill Wikidata's gaps
        run: |
          # Reads the English articles of active players and a quarter of the others, about 10 requests a minute. If Wikipedia fails, keep last week's careers.
          if node scripts/build-wiki-careers.mjs --refresh; then
            node scripts/build-data.mjs # second pass from the cached Wikidata answers, now with the careers merged
          else
            echo "::warning::Wikipedia careers refresh failed, keeping the previous ones"; git checkout scripts/wiki-careers.json 2>/dev/null || true
          fi

      - name: Check nothing important disappeared
        run: |
          set -o pipefail
          node scripts/check-data.mjs "$RUNNER_TEMP/football-before.json" src/data/football.json | tee "$RUNNER_TEMP/summary.txt"

      - name: Tests
        run: npm test && npm run typecheck

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          git add src/data/football.json scripts/wiki-data.json scripts/wiki-careers.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          DAY=$(date -u +%Y-%m-%d)
          BRANCH="data-refresh/$DAY-$GITHUB_RUN_ID"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Weekly data refresh ($DAY)"
          git push origin "HEAD:refs/heads/$BRANCH"
          {
            echo "Weekly data refresh from Wikidata and Wikipedia, checked by scripts/check-data.mjs."
            echo
            echo "Merging this deploys the new data. Look for odd additions (a player in a club he never played for) before merging."
            echo
            echo '```'
            cat "$RUNNER_TEMP/summary.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base "$BASE" --head "$BRANCH" --title "Data refresh $DAY" --body-file "$RUNNER_TEMP/body.md" \
            || echo "::warning::Could not open the pull request (allow GitHub Actions to create pull requests in the repository settings). The branch $BRANCH is pushed: open it by hand."
