# Deploys the site to Cloudflare Workers (free plan, *.workers.dev address).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Runs on every push to main or preview, or by hand from the Actions tab.
name: Deploy

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Find or create the D1 database
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="name-the-players");process.stdout.write(db?db.uuid:"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create name-the-players; ID=$(find_id); fi
          test -n "$ID"
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          echo "D1 database: $ID"

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          # Optional sign-in: Google client id and sender address are public repo variables.
          VARS=""
          [ -n "$GOOGLE_CLIENT_ID" ] && VARS="$VARS --var GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID"
          [ -n "$MAIL_FROM" ] && VARS="$VARS --var MAIL_FROM:$MAIL_FROM"
          npx wrangler deploy $VARS

      - name: E-mail key (optional)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: if [ -n "$RESEND_API_KEY" ]; then echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi

      - name: Admin password (optional)
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: if [ -n "$ADMIN_KEY" ]; then echo "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY; fi
